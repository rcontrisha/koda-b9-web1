<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator</title>
  <link rel="stylesheet" href="../calculator.css">
</head>
<body>
  <main>
    <div class="field">
      <p>0</p>
    </div>
    <div class="main-container">
      <div class="advanced-container">
        <div class="btn">Deg</div>
        <div class="btn">Rad</div>
        <div class="btn">x!</div>
        <div class="btn">Inv</div>
        <div class="btn">sin</div>
        <div class="btn">ln</div>
        <div class="btn">π</div>
        <div class="btn">cos</div>
        <div class="btn">log</div>
        <div class="btn">e</div>
        <div class="btn">tan</div>
        <div class="btn">√</div>
        <div class="btn">Ans</div>
        <div class="btn">EXP</div>
        <div class="btn">x<sup>y</sup></div>
      </div>
      <div class="basic-container">
        <div class="btn">(</div>
        <div class="btn">)</div>
        <div class="btn">%</div>
        <div class="btn">CE</div>
        <div class="num-btn">7</div>
        <div class="num-btn">8</div>
        <div class="num-btn">9</div>
        <div class="btn">÷</div>
        <div class="num-btn">4</div>
        <div class="num-btn">5</div>
        <div class="num-btn">6</div>
        <div class="btn">x</div>
        <div class="num-btn">1</div>
        <div class="num-btn">2</div>
        <div class="num-btn">3</div>
        <div class="btn">-</div>
        <div class="num-btn">0</div>
        <div class="num-btn">.</div>
        <div class="sum-btn">=</div>
        <div class="btn">+</div>
      </div>
    </div>
  </main>
</body>
</html>
